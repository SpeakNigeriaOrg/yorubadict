name: Dictionary changes

# The other half of the weekly "Dictionary changes" pull request, which
# refresh.yml opens with one sheet, tools/slugs/changes.md, listing every change
# to a web address - words new, gone, renamed, respelled - for a person to settle
# on github.com.
#
#   on every edit to the sheet in the pull request: try it against the ledger
#   and say, in a comment, exactly what it will do - or what to fix.
#
#   on merge: write it into data/url-slugs.json, remove the sheet, commit.
#
# Merging is the sign-off; nobody runs anything.

on:
  pull_request:
    paths: ['tools/slugs/changes.md']
  push:
    branches: [main]
    paths: ['tools/slugs/changes.md']

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Try the sheet against the ledger
        id: try
        run: |
          set -o pipefail
          {
            node tools/slugs/changes.mjs apply tools/slugs/changes.md \
              && python3 tools/slugs/check.py
          } 2>&1 | tee result.txt

      - name: Say what it will do, or what to fix
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.try.outcome }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            {
              echo "✓ **Ready to merge.** Merging will do exactly this:"
              echo
              echo '```'
              grep -E '^  /yo/|^  [^ ].* (→|now shows|is gone|is NOT)' result.txt || echo "(nothing - every line was left empty)"
              echo '```'
              echo
              echo "Anything left empty waits for next week."
            } > comment.md
          else
            {
              echo "✗ **Not ready yet.** Edit the sheet again and this check reruns."
              echo
              echo '```'
              grep -E 'PROBLEM|FAIL|claimed by' result.txt | head -20
              echo '```'
              echo
              echo "\"claimed by 2\" means two words under one heading are the same - each must differ."
            } > comment.md
          fi
          gh pr comment "$PR" --body-file comment.md

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Write the decisions into the ledger
        run: |
          set -euo pipefail
          node tools/slugs/changes.mjs apply tools/slugs/changes.md
          python3 tools/slugs/check.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -q tools/slugs/changes.md
          git add data/url-slugs.json
          git commit -m "Apply the reviewed dictionary changes"
          git push

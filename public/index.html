<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sọ̀rọ̀ Sókè — The People’s Yorùbá Dictionary · Speak Nigeria</title>
<meta name="description" content="Sọ̀rọ̀ Sókè, The People’s Yorùbá Dictionary — a free Yorùbá dictionary built from Wiktionary data. Search Yorùbá or English, in either direction, with tone marks or without. A Speak Nigeria project." />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="wordmark-group">
      <a href="#/" class="wordmark">
        <span class="wordmark-yo">Sọ̀rọ̀ Sókè</span><span class="wordmark-en">The People’s<br class="wordmark-break" /> Yorùbá Dictionary</span>
      </a>
    </div>

    <div class="header-search">
      <div class="search-field">
        <input
          id="search-input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search Yorùbá or English…  (ile, fa, pull…)"
          aria-label="Search the dictionary"
        />
        <!-- Search scope: which side(s) of the dictionary the query is matched
             against, cycling YO/EN → YO → EN. Replaces the row of radio
             buttons that used to sit under the search box. -->
        <button id="mode-cycle" class="mode-cycle" type="button"></button>
      </div>
      <div class="tone-rule" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    
    <div class="header-actions">
      <button id="menu-toggle" class="menu-toggle" type="button"
              aria-expanded="false" aria-controls="header-menu" aria-label="Menu">≡</button>
      <div id="header-menu" class="header-menu">
        <a href="#/about" class="ghost-btn">About</a>
        <button id="data-quality-toggle" class="ghost-btn" type="button">Data quality</button>
      </div>
    </div>
  </div>
</header>

<main class="app-shell">
  <aside id="results-pane" class="results-pane" aria-label="Search results">
    <div id="results-list" role="listbox"></div>
  </aside>

  <section id="entry-pane" class="entry-pane" aria-label="Entry detail">
    <!-- Mobile only (<=800px): affordance for the scroll-up gesture, and a
         tap shortcut for it. Lives outside #entry-content because that
         element's innerHTML is replaced on every render. -->
    <button id="sheet-handle" class="sheet-handle" type="button">
      <span class="sheet-grip" aria-hidden="true"></span>
      <span class="sr-only">Scroll to the definition</span>
    </button>
    <div id="entry-content"></div>
  </section>
</main>

<div id="quality-panel" class="quality-panel hidden">
  <div class="quality-panel-inner">
    <button id="quality-close" class="ghost-btn" type="button">Close</button>
    <h2>Data quality report</h2>
    <div id="quality-content"></div>
  </div>
</div>

<footer class="site-footer">
  <div class="footer-inner">
    <a href="https://speaknigeria.org" class="parent-brand" target="_blank" rel="noopener noreferrer">
      <!-- Inlined rather than <img src="favicon.svg">, which was a second
           round trip for 718 bytes and popped in after the text beside it.
           favicon.svg itself stays: it's still the tab icon (see <head>). -->
      <svg width="20" height="20" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
        <rect width="64" height="64" rx="14" fill="#21295C"/>
        <g fill="#E9A82C">
          <path d="M32 11 C 38 20, 38 28, 32 33 C 26 28, 26 20, 32 11 Z"/>
          <path d="M32 11 C 38 20, 38 28, 32 33 C 26 28, 26 20, 32 11 Z" transform="rotate(72 32 33)"/>
          <path d="M32 11 C 38 20, 38 28, 32 33 C 26 28, 26 20, 32 11 Z" transform="rotate(144 32 33)"/>
          <path d="M32 11 C 38 20, 38 28, 32 33 C 26 28, 26 20, 32 11 Z" transform="rotate(216 32 33)"/>
          <path d="M32 11 C 38 20, 38 28, 32 33 C 26 28, 26 20, 32 11 Z" transform="rotate(288 32 33)"/>
        </g>
        <circle cx="32" cy="33" r="5.5" fill="#C6385A"/>
        <circle cx="32" cy="33" r="2.2" fill="#E9A82C"/>
      </svg>
      <span>A Speak Nigeria project</span>
    </a>
    <a href="https://speaknigeria.org/courses.html" class="footer-link" target="_blank" rel="noopener noreferrer">Courses ↗</a>
    <a href="https://games.speaknigeria.org/" class="footer-link" target="_blank" rel="noopener noreferrer">Games ↗</a>
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>

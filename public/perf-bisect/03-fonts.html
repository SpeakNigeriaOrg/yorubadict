<title>Bisect 03 — stylesheets and fonts</title>
<!-- One of four pages in public/perf-bisect. Each adds exactly one layer to
     the one before it, so a PageSpeed run on each says which layer delays the
     first paint. Read public/perf-bisect/README.md before changing anything
     here: the value of these pages is entirely in the differences between
     them, so a tweak to one that is not made to the others makes the whole
     set say nothing. Delete the directory when the question is answered. -->
<link rel="stylesheet" href="/_tokens.css" />
<link rel="stylesheet" href="/style.css" />
<link rel="preload" as="style" fetchpriority="high"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
      onload="this.rel='stylesheet'" />
<noscript>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" />
</noscript>
</head>
<body>
<main>
<div class="entry-welcome">
<h1>Ẹ káàbọ̀.</h1>

<p>Try: <em>fa</em>, <em>de</em>, <em>ile</em>, or <em>pull</em>.</p>
</div>
</main>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Bisect 06 — font stylesheet added after paint</title>
<!-- One of the measurement pages in public/perf-bisect. Every one of them is
     02-css plus exactly one change, so the difference between two scores is
     the cost of that one change and nothing else. Read the README before
     editing: a tweak made to one page and not the others makes the whole set
     say nothing. Delete the directory when the question is answered. -->
<link rel="stylesheet" href="/_tokens.css" />
<link rel="stylesheet" href="/style.css" />
<script>
(function () {
  var add = function () {
    var l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap';
    document.head.appendChild(l);
  };
  var done = false;
  var go = function () { if (!done) { done = true; add(); } };
  try {
    var o = new PerformanceObserver(function () { o.disconnect(); go(); });
    o.observe({ type: 'largest-contentful-paint', buffered: true });
  } catch (e) {
    addEventListener('load', go);
  }
  setTimeout(go, 3000);
})();
</script>
</head>
<body>
<main>
<div class="entry-welcome">
<h1>Ẹ káàbọ̀.</h1>
<p>Search for a Yorùbá word with or without tone marks and underdots. Or search by an English word that appears in a definition. Everything runs locally in your browser after the first load.</p>
<p>Try: <em>fa</em>, <em>de</em>, <em>ile</em>, or <em>pull</em>.</p>
</div>
</main>
</body>
</html>
